<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Host</title>
<style>
:root{--bg:#faf5ee;--card:#fff;--ink:#2b2420;--mute:#7a6d63;--acc:#b5482a;--line:#e8dccd;--chip:#f1e6d8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1713;--card:#272019;--ink:#f3ebe1;--mute:#a99a8c;--acc:#e07a55;--line:#3a3028;--chip:#332a22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1713;--card:#272019;--ink:#f3ebe1;--mute:#a99a8c;--acc:#e07a55;--line:#3a3028;--chip:#332a22;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
header{text-align:center;padding:24px 0 8px}
h1{font-size:2.6rem;letter-spacing:.02em}
.logo-frame{width:128px;height:128px;border:3px solid var(--acc);border-radius:50%;padding:4px;margin:0 auto}
.logo-crop{display:block;width:100%;height:100%;overflow:hidden;border-radius:50%}
.logo{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.28)}
.sub{color:var(--mute);margin:4px 0 0}
nav{display:flex;gap:8px;justify-content:center;margin:20px 0;flex-wrap:wrap}
nav a{padding:8px 16px;border-radius:99px;background:var(--chip);color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem}
nav a.on{background:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.date{color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem}
.card h2{font-size:1.5rem;margin:4px 0 8px}
.card p{white-space:pre-wrap;margin:0 0 12px}
.hero{border:2px solid var(--acc)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.imgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in;background:var(--chip)}
form{display:grid;gap:10px}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}
button{padding:10px 18px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:var(--chip);color:var(--mute);padding:6px 12px;font-size:.85rem}
button:disabled{opacity:.5}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.note{color:var(--mute);font-size:.85rem}
.note a{color:var(--mute)}
.prev{display:flex;gap:6px;flex-wrap:wrap}.prev img{width:56px;height:56px;object-fit:cover;border-radius:8px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>
<body>
<main>
<header><h1 class="logo-frame"><span class="logo-crop"><img class="logo" src="The%20Host%20Logo.jpeg" alt="The Host"></span></h1><p class="sub">Immer am zweiten Freitag des Monats: ein besonderes Essen 🍽️</p></header>
<nav id="nav"><a href="#next">Nächstes Essen</a><a href="#past">Schon gekocht</a><a href="#ideas">Vorschläge</a></nav>
<div id="view"></div>
<p class="note" id="status" style="text-align:center"></p>
<p class="note" id="foot" style="text-align:center"></p>
</main>
<div id="lb"><img alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ====== HIER EINTRAGEN (Supabase → Project Settings → API) ====== */
const SUPABASE_URL='https://ecpuiztrswlywgesihou.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_HFAsiF-XCen420fysA_AjA_O7lv7543';
/* ================================================================ */

const $=s=>document.querySelector(s);
const S={dinners:[],ideas:[],edit:false,loaded:false};
const configured=!SUPABASE_URL.includes('DEIN-PROJEKT');
const sb=configured?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=s=>{try{return new Date(s+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return s}};
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in attrs||{}){if(k==='on')for(const ev in attrs.on)e.addEventListener(ev,attrs.on[ev]);else if(k==='text')e.textContent=attrs[k];else e.setAttribute(k,attrs[k])}kids.flat().forEach(x=>x!=null&&e.append(x));return e}
function imgs(list){if(!list||!list.length)return null;return h('div',{class:'imgs'},list.map(url=>h('img',{src:url,loading:'lazy',alt:'Gericht',on:{click:()=>{$('#lb img').src=url;$('#lb').style.display='flex'}}})))}
$('#lb').onclick=()=>$('#lb').style.display='none';

async function shrink(file){
  try{const bmp=await createImageBitmap(file);const r=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*r);c.height=Math.round(bmp.height*r);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',.85))}catch(e){return file}
}
async function upload(files,btn,folder){
  const urls=[];let i=0;
  for(const f of files){btn.textContent='Lade Bild '+(++i)+'/'+files.length+' …';
    const blob=await shrink(f);
    const path=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
    const {error}=await sb.storage.from('images').upload(path,blob,{contentType:'image/jpeg'});
    if(error)throw error;
    urls.push(sb.storage.from('images').getPublicUrl(path).data.publicUrl);
  }
  return urls;
}
async function load(){
  const [d,i]=await Promise.all([
    sb.from('dinners').select('*').order('date'),
    sb.from('ideas').select('*').order('created_at',{ascending:false})]);
  if(d.error||i.error){$('#status').textContent='Fehler beim Laden: '+(d.error||i.error).message;return}
  S.dinners=d.data;S.ideas=i.data;S.loaded=true;$('#status').textContent='';render();
}
function formFor(kind){
  const isD=kind==='dinners';
  const f={};
  const prev=h('div',{class:'prev'});
  f.date=isD?h('input',{type:'date',required:'',value:''}):null;
  f.author=isD?null:h('input',{placeholder:'Dein Name',required:'',maxlength:'40'});
  f.title=h('input',{placeholder:isD?'Titel des Menüs':'Dein Gerichte-Vorschlag',required:'',maxlength:'100'});
  f.text=h('textarea',{placeholder:isD?'Menü, Gänge, Besonderheiten …':'Beschreibung, Idee, Link zum Rezept …',maxlength:'4000'});
  f.files=h('input',{type:'file',accept:'image/*',multiple:''});
  f.files.addEventListener('change',()=>{prev.replaceChildren();[...f.files.files].forEach(x=>prev.append(h('img',{src:URL.createObjectURL(x),alt:''})))});
  const btn=h('button',{type:'submit'},isD?'Eintrag speichern':'Vorschlag senden');
  const form=h('form',{on:{submit:async e=>{e.preventDefault();btn.disabled=true;const label=btn.textContent;
    try{
      const files=[...f.files.files];
      const urls=files.length?await upload(files,btn,isD?'dinners':'ideas'):[];
      const row=isD?{title:f.title.value.trim(),date:f.date.value,text:f.text.value.trim(),imgs:urls}
        :{title:f.title.value.trim(),author:f.author.value.trim(),text:f.text.value.trim(),imgs:urls};
      const {error}=await sb.from(kind).insert(row);
      if(error)throw error;
      form.reset();prev.replaceChildren();await load();
    }catch(err){alert('Das hat nicht geklappt: '+(err&&err.message||err))}
    btn.disabled=false;btn.textContent=label}}},
    f.date,f.author,f.title,f.text,h('label',{class:'note'},'Bilder (Multiupload möglich)'),f.files,prev,btn);
  return form;
}
async function del(table,id,q){
  if(!confirm(q))return;
  const {error}=await sb.from(table).delete().eq('id',id);
  if(error)alert('Löschen fehlgeschlagen: '+error.message);else load();
}
function dinnerCard(d,hero){
  return h('div',{class:'card'+(hero?' hero':'')},
    h('div',{class:'row'},h('div',{class:'date',text:fmt(d.date)}),
      S.edit?h('button',{class:'ghost',on:{click:()=>del('dinners',d.id,'Eintrag löschen?')}},'Löschen'):null),
    h('h2',{text:d.title}),d.text?h('p',{text:d.text}):null,imgs(d.imgs));
}
function loginView(){
  const msg=h('p',{class:'note'});
  const email=h('input',{type:'email',placeholder:'E-Mail',required:'',autocomplete:'username'});
  const pw=h('input',{type:'password',placeholder:'Passwort',required:'',autocomplete:'current-password'});
  const form=h('form',{on:{submit:async e=>{e.preventDefault();
    const {error}=await sb.auth.signInWithPassword({email:email.value,password:pw.value});
    if(error)msg.textContent='Login fehlgeschlagen: '+error.message;else location.hash='#next'}}},
    email,pw,h('button',{type:'submit'},'Anmelden'),msg);
  return h('div',{class:'card'},h('h3',{text:'Host-Login'}),h('div',{style:'height:10px'}),form);
}
function render(){
  const v=$('#view');v.replaceChildren();
  const page=(location.hash||'#next').slice(1);
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+page));
  const foot=$('#foot');foot.replaceChildren();
  if(sb){foot.append(S.edit?h('a',{href:'#',on:{click:e=>{e.preventDefault();sb.auth.signOut()}}},'Host abmelden'):h('a',{href:'#login'},'Host-Login'))}
  if(!configured){v.append(h('div',{class:'empty'},'Bitte zuerst SUPABASE_URL und SUPABASE_ANON_KEY im Code eintragen.'));return}
  if(page==='login'){v.append(loginView());return}
  if(!S.loaded){v.append(h('div',{class:'empty'},'Daten werden geladen …'));return}
  const t=today();
  const up=S.dinners.filter(d=>d.date>=t).sort((a,b)=>a.date<b.date?-1:1);
  const past=S.dinners.filter(d=>d.date<t).sort((a,b)=>a.date<b.date?1:-1);
  if(page==='past'){
    if(!past.length)v.append(h('div',{class:'empty'},'Noch keine vergangenen Essen. Das erste kommt bald!'));
    past.forEach(d=>v.append(dinnerCard(d)));
  }else if(page==='ideas'){
    v.append(h('div',{class:'card'},h('h3',{text:'Dein Vorschlag für The Host'}),h('p',{class:'note',text:'Was soll ich als Nächstes kochen? Schick mir Ideen mit Foto und Text.'}),formFor('ideas')));
    S.ideas.forEach(s=>v.append(h('div',{class:'card'},
      h('div',{class:'row'},h('div',{class:'date',text:'Von '+s.author}),
        S.edit?h('button',{class:'ghost',on:{click:()=>del('ideas',s.id,'Vorschlag löschen?')}},'Löschen'):null),
      h('h2',{text:s.title}),s.text?h('p',{text:s.text}):null,imgs(s.imgs))));
    if(!S.ideas.length)v.append(h('div',{class:'empty'},'Noch keine Vorschläge – sei der Erste!'));
  }else{
    if(up.length){v.append(h('p',{class:'date',style:'text-align:center',text:'Als Nächstes'}),dinnerCard(up[0],true));
      up.slice(1).forEach(d=>v.append(dinnerCard(d)))}
    else v.append(h('div',{class:'empty'},'Der nächste Termin steht noch nicht fest. Bald mehr! 🍷'));
    if(S.edit)v.append(h('div',{class:'card'},h('h3',{text:'Neuer Eintrag (nur für dich als Host)'}),h('div',{style:'height:10px'}),formFor('dinners')));
  }
}
window.addEventListener('hashchange',render);
render();
if(sb){
  sb.auth.getSession().then(({data})=>{S.edit=!!data.session;render()});
  sb.auth.onAuthStateChange((_e,session)=>{S.edit=!!session;render()});
  load();
  sb.channel('live').on('postgres_changes',{event:'*',schema:'public'},load).subscribe();
}
</script>
</body>
</html>
